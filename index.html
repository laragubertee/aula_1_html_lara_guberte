<!DOCTYPE html>
<!-- Tag semântica que avisa o website qual o tipo de arquivo ele irá processar. -->
<html lang="pt-br">
  <head>
    <!--Na tag HEAD irá os metadados do website.-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha primeira página</title>
    <!-- Título que aparece na aba-->
  </head>
  <body>
    <header>
      <h1>Meu site</h1>

      <nav>
        <!-- Estrutura do menu de navegação-->
        <a href="index.html">Início</a>
        <!-- Faz o link e redireciona para o endereço informado no atribuido href-->
        <a>Sobre</a>
        <a>Contato</a>
      </nav>
    </header>
    <!-- Menu de navegação, cabeçalho-->
    <main>
      <section> <!-- Para cortar em seções a página HTML.-->
        <h2>Supernatural</h2>
        <p>Escreva aqui um parágrafo curto explicando o conteúdo da página.</p>
      </section>
      <section>
        <img src="Supernatural.jpg" alt="É uma foto da série Supernatural" height="400" width="700">
        <!-- "img" serve para adicionar fotos com o src, o "alt" é para descrever a imagem  e "height" e "width" servem para largura e altura da foto.-->
      </section>
    </main>
    <!-- Parte principal da página-->
    <footer> 
      <p> &copy; DSM3, 2026 - Lara</p>
    </footer>
    <!-- Vai a parte final, o rodapé-->
    <!-- Aqui vai o que é visível o website.-->
  </body>
</html>
